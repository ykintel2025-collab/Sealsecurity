<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dienst Logboek - Seal Security</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF & AutoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="bg-slate-800 border border-slate-700 rounded-xl p-6 mb-6 shadow-lg flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-amber-400">Seal Security</h1>
                <p class="text-slate-400 text-sm">Operationeel Dienst Logboek</p>
            </div>
            <div class="flex gap-3">
                <button onclick="exportPDF()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2">
                    📄 Exporteer PDF
                </button>
            </div>
        </header>

        <!-- Input Form / Controls -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 mb-6 shadow-lg">
            <h2 class="text-lg font-semibold mb-4 text-slate-200">Nieuwe Melding Toevoegen</h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Categorie</label>
                    <select id="logCategory" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-amber-400">
                        <option value="Algemeen">Algemeen</option>
                        <option value="Incident">Incident</option>
                        <option value="Ronde">Ronde / Inspectie</option>
                        <option value="Bezoeker">Bezoeker / Toegang</option>
                        <option value="Storing">Storing / Technisch</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Locatie</label>
                    <input type="text" id="logLocation" placeholder="Bijv. Hoofdingang / Terrein B" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-amber-400">
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-xs font-medium text-slate-400 mb-1">Omschrijving / Notitie</label>
                <textarea id="logDescription" rows="3" placeholder="Typ of spreek je melding in..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-amber-400"></textarea>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-4">
                <button id="micBtn" onclick="toggleAudioRecording()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2.5 rounded-lg font-medium transition flex items-center gap-2">
                    🎙️ Spraakbericht opnemen
                </button>
                <button onclick="saveLogItem()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-6 py-2.5 rounded-lg transition">
                    Toevoegen aan Logboek
                </button>
            </div>

            <!-- Status indicator voor spraak -->
            <div id="speechStatus" class="hidden mt-3 text-sm text-amber-400 animate-pulse">
                Luistert... Spreek nu je melding in.
            </div>
        </div>

        <!-- Logboek Overzicht -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-lg">
            <h2 class="text-lg font-semibold mb-4 text-slate-200">Actueel Logboek</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400 text-xs uppercase">
                            <th class="p-3">Tijdstip</th>
                            <th class="p-3">Categorie</th>
                            <th class="p-3">Locatie</th>
                            <th class="p-3">Omschrijving</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody" class="divide-y divide-slate-700 text-sm">
                        <!-- Dynamische rijen komen hier -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JavaScript Logica -->
    <script>
        let allLogs = [];
        let isRecordingAudio = false;
        let speechRecognitionInstance = null;
        let mediaRecorder = null;
        let audioChunks = [];

        // Dummy/lokale lijst voor opzet (pas aan naar jouw Firebase koppeling indien gewijd)
        function loadLogs() {
            const saved = localStorage.getItem('seal_security_logs');
            if (saved) {
                allLogs = JSON.parse(saved);
                renderLogs();
            }
        }

        function saveLogItem() {
            const category = document.getElementById('logCategory').value;
            const location = document.getElementById('logLocation').value || 'N.v.t.';
            const description = document.getElementById('logDescription').value;

            if (!description.trim()) {
                alert('Vul a.u.b. een omschrijving in.');
                return;
            }

            const newItem = {
                id: Date.now(),
                tijd: new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }),
                datum: new Date().toLocaleDateString('nl-NL'),
                categorie: category,
                locatie: location,
                omschrijving: description
            };

            allLogs.unshift(newItem);
            localStorage.setItem('seal_security_logs', JSON.stringify(allLogs));

            // Velden leegmaken
            document.getElementById('logDescription').value = '';
            document.getElementById('logLocation').value = '';

            renderLogs();
        }

        function renderLogs() {
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = '';

            if (allLogs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-500">Nog geen logboekitems toegevoegd.</td></tr>`;
                return;
            }

            allLogs.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 text-slate-300 font-mono text-xs">${item.tijd}</td>
                    <td class="p-3"><span class="bg-slate-700 text-amber-300 px-2 py-1 rounded text-xs">${item.categorie}</span></td>
                    <td class="p-3 text-slate-300">${item.locatie}</td>
                    <td class="p-3 text-slate-100">${item.omschrijving}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleAudioRecording() {
            if (!isRecordingAudio) {
                startAudioRecording();
            } else {
                stopAudioRecording();
            }
        }

        function startAudioRecording() {
            const statusEl = document.getElementById('speechStatus');
            const micBtn = document.getElementById('micBtn');

            // Web Speech API check
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                speechRecognitionInstance = new SpeechRecognition();
                speechRecognitionInstance.lang = 'nl-NL';
                speechRecognitionInstance.interimResults = true;
                speechRecognitionInstance.continuous = true;

                speechRecognitionInstance.onresult = (event) => {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        transcript += event.results[i][0].transcript;
                    }
                    document.getElementById('logDescription').value = transcript;
                };

                speechRecognitionInstance.onerror = (e) => {
                    console.error("Spraakherkenning fout:", e);
                };

                speechRecognitionInstance.start();
            }

            isRecordingAudio = true;
            statusEl.classList.remove('hidden');
            micBtn.innerText = "⏹️ Opname stoppen";
            micBtn.classList.add('bg-red-600', 'text-white');
        }

        function stopAudioRecording() {
            const statusEl = document.getElementById('speechStatus');
            const micBtn = document.getElementById('micBtn');

            if (speechRecognitionInstance) {
                try {
                    speechRecognitionInstance.stop();
                } catch(e) {}
            }

            isRecordingAudio = false;
            statusEl.classList.add('hidden');
            micBtn.innerText = "🎙️ Spraakbericht opnemen";
            micBtn.classList.remove('bg-red-600', 'text-white');
        }

        window.exportPDF = function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFont("helvetica", "bold");
            doc.setFontSize(18);
            doc.text("Dienst Logboek - Seal Security", 14, 20);

            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            doc.text(`Gegenereerd op: ${new Date().toLocaleString('nl-NL')}`, 14, 28);

            const tableData = allLogs.map(item => [
                item.tijd,
                item.categorie,
                item.locatie,
                item.omschrijving
            ]);

            doc.autoTable({
                startY: 35,
                head: [['Tijdstip', 'Categorie', 'Locatie', 'Omschrijving']],
                body: tableData,
                theme: 'grid',
                headStyles: { fillColor: [30, 41, 59] },
                styles: { fontSize: 9, cellPadding: 3 }
            });

            doc.save(`Dienst_Logboek_${new Date().toISOString().slice(0,10)}.pdf`);
        }

        // Init opstarten
        window.onload = loadLogs;
    </script>
</body>
</html>
